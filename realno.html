<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Bee Swarm Server Join</title>

  <meta property="og:title" content="Bee Swarm Server Join" />
  <meta property="og:description" content="Нажми, чтобы зайти на сервер Bee Swarm Simulator" />
  <meta property="og:type" content="website" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd84d, #ff9f1c, #2d2d2d);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
    }

    .bee {
      font-size: 56px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      margin: 0 0 22px;
      color: #f4f4f4;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      width: 100%;
      padding: 15px 20px;
      border-radius: 14px;
      background: #ffcc00;
      color: #1f1f1f;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      transition: 0.2s;
      border: none;
      cursor: pointer;
    }

    .button:hover {
      transform: scale(1.03);
      background: #ffe066;
    }

    .small {
      margin-top: 18px;
      font-size: 13px;
      color: #dddddd;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="bee">🐝</div>
    <h1>Bee Swarm Server</h1>
    <p>Сейчас попробуем открыть Roblox и зайти на нужный сервер.</p>

    <button class="button" onclick="openRoblox()">
      Открыть Roblox
    </button>

    <div class="small">
      Если Roblox не открылся автоматически, нажми кнопку.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const placeId = params.get("placeId") || "1537690962";
    const jobId = params.get("jobId");

    function openRoblox() {
      if (!jobId) {
        alert("Ошибка: в ссылке нет jobId");
        return;
      }

      const robloxUrl =
        "roblox://experiences/start?placeId=" +
        encodeURIComponent(placeId) +
        "&gameInstanceId=" +
        encodeURIComponent(jobId);

      window.location.href = robloxUrl;
    }

    if (jobId) {
      setTimeout(openRoblox, 700);
    }
  </script>
</body>
</html>
