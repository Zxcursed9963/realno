<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Roblox</title>
</head>
<body>
  <h2>Открываю Roblox...</h2>
  <p>Если Roblox не открылся, нажми кнопку:</p>
  <button onclick="openRoblox()">Зайти на сервер</button>

  <script>
    const placeId = "1537690962";

    function getJobId() {
      // Берёт всё после домена:
      // https://site.netlify.app/f5cf8c7e-176f-4390-97c9-cd2ebba26838
      let jobId = window.location.pathname.replace("/", "").trim();

      // На всякий случай также поддержка ?jobId=...
      if (!jobId) {
        const params = new URLSearchParams(window.location.search);
        jobId = params.get("jobId");
      }

      return jobId;
    }

    function openRoblox() {
      const jobId = getJobId();

      if (!jobId) {
        alert("Нет jobId в ссылке");
        return;
      }

      const robloxUrl =
        "roblox://experiences/start?placeId=" +
        encodeURIComponent(placeId) +
        "&gameInstanceId=" +
        encodeURIComponent(jobId);

      window.location.href = robloxUrl;
    }

    setTimeout(openRoblox, 500);
  </script>
</body>
</html>
