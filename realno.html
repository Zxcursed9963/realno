<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Переход в Roblox...</title>
</head>
<body>
    <h2>Запуск Roblox... Если игра не открылась, нажмите <a id="manual-link" href="#">сюда</a>.</h2>

    <script>
        // Получаем параметры placeId и gameInstanceId (или jobId) из URL сайта
        const urlParams = new URLSearchParams(window.location.search);
        const placeId = urlParams.get('placeId');
        // Поддерживаем оба варианта названия параметра
        const jobId = urlParams.get('gameInstanceId') || urlParams.get('jobId');

        if (placeId && jobId) {
            // Формируем прямую ссылку для запуска Roblox
            const robloxUri = `roblox://experiences/start?placeId=${placeId}&gameInstanceId=${jobId}`;
            
            // Настраиваем ссылку для ручного клика (на всякий случай)
            document.getElementById('manual-link').href = robloxUri;

            // Автоматически перенаправляем пользователя (запускаем Roblox)
            window.location.href = robloxUri;

            // Дополнительно закрываем вкладку через 3 секунды, чтобы не висела пустой
            setTimeout(() => { window.close(); }, 3000);
        } else {
            document.body.innerHTML = "<h2>Ошибка: Не указаны параметры placeId или gameInstanceId.</h2>";
        }
    </script>
</body>
</html>
